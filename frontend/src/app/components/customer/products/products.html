<section style="display: grid; gap: 1rem;">
  <h2>All Products</h2>

  <div *ngIf="products$ | async as products; else loading">
    <div style="display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));">
      <div
        *ngFor="let product of products"
        style="border: 1px solid #ddd; border-radius: 10px; padding: 1rem; display: flex; flex-direction: column; box-shadow: 0 2px 6px rgba(0,0,0,0.05);"
      >
        <img [src]="product.imageUrl" [alt]="product.name" style="width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 1rem;" />
        <h3 style="margin-top: 0;">{{ product.name }}</h3>
        <p>Price: {{ product.price | number: '1.2-2' }}</p>

        <button
          type="button"
          (click)="onAddToCart(product)"
          style="
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
          "
          onmouseover="this.style.backgroundColor='#1d4ed8'"
          onmouseout="this.style.backgroundColor='#2563eb'"
        >
          🛒 Add to cart
        </button>

      </div>
    </div>
    <p *ngIf="products.length === 0">No products found.</p>
  </div>

  <ng-template #loading>
    <p>Loading products...</p>
  </ng-template>
</section>
