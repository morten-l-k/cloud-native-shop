<section style="display: grid; gap: 1rem;">
  <h2>All Products</h2>

  <div *ngIf="products$ | async as products; else loading">
    <div style="display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
      <mat-card *ngFor="let product of products" class="product-card" style="display: flex; flex-direction: column;">
        <img mat-card-image [src]="product.imageUrl" [alt]="product.name" style="aspect-ratio: 1 / 1; object-fit: cover;" />
        <mat-card-header>
          <mat-card-title>{{ product.name }}</mat-card-title>
          <mat-card-subtitle>{{ product.price | currency:'USD' }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-actions style="margin-top: auto; display: flex; gap: 8px; padding: 8px;">
          <button
            type="button"
            [routerLink]="['/customer/products', product.id]"
            style="
              flex: 1;
              padding: 8px 12px;
              border: 1px solid #ccc;
              border-radius: 6px;
              background-color: white;
              color: #333;
              font-weight: 500;
              cursor: pointer;
              transition: background-color 0.2s ease;
            "
            onmouseover="this.style.backgroundColor='#f9fafb'"
            onmouseout="this.style.backgroundColor='white'"
          >
            View
          </button>
          <button
            type="button"
            (click)="onAddToCart(product)"
            style="
              flex: 2;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 6px;
              padding: 8px 12px;
              border: none;
              border-radius: 6px;
              background-color: #2563eb;
              color: white;
              font-weight: 500;
              cursor: pointer;
              transition: background-color 0.2s ease;
            "
            onmouseover="this.style.backgroundColor='#1d4ed8'"
            onmouseout="this.style.backgroundColor='#2563eb'"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
              <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            Add to cart
          </button>
        </mat-card-actions>

      </mat-card>
    </div>
    <p *ngIf="products.length === 0">No products found.</p>
  </div>

  <ng-template #loading>
    <p>Loading products...</p>
  </ng-template>
</section>
