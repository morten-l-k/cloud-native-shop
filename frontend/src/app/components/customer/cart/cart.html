<section style="display: grid; gap: 1rem;">
  <h2>Your Cart</h2>

  <div *ngIf="cartItems$ | async as items; else emptyCart">
    <div
      *ngIf="items.length > 0; else emptyCart"
      style="display: flex; flex-direction: column; gap: 1rem;"
    >
      <div
        *ngFor="let item of items"
        style="
          border: 1px solid #ddd;
          border-radius: 10px;
          padding: 1rem;
          background: #fafafa;
          display: flex;
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
          color: #777;
        "
      >
        <div>
          <h3 style="margin-top: 0; color: #333; margin-bottom: 0;">{{ item.name }}</h3>
          <p style="margin: 0;">Price: {{ item.price | number: '1.2-2' }}</p>
        </div>
        <button (click)="onRemoveFromCart(item)" style="background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 500;">Remove</button>
      </div>
    </div>

    <!-- Total row -->
    <div
      style="
        display: flex;
        justify-content: flex-end;
        align-items: center;
        font-size: 1.2rem;
        font-weight: 600;
        margin-top: 0.5rem;
      "
    >
      Total: {{ total$ | async | number: '1.2-2' }}
    </div>

    <div style="display: flex; justify-content: flex-end;">
      <a
        routerLink="/customer/payment"
        style="
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 0.75rem 1.25rem;
          border-radius: 8px;
          background: #16a34a;
          color: white;
          text-decoration: none;
          font-weight: 600;
        "
      >
        Pay
      </a>
    </div>
  </div>
  <ng-template #emptyCart>
    <p>Your cart is empty.</p>
  </ng-template>
</section>
