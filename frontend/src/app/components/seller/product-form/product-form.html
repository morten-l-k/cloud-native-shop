<h2 mat-dialog-title>{{ isEdit ? 'Edit Product' : 'New Product' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 0.75rem; padding-top: 0.5rem; min-width: 420px;">

    <mat-form-field appearance="outline">
      <mat-label>Product Name *</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Wireless Headphones">
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        <mat-option value="">-- None --</mat-option>
        <mat-option *ngFor="let cat of categories" [value]="cat.productCategoryName">
          {{ cat.productCategoryNameEnglish || cat.productCategoryName }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Short product description"></textarea>
    </mat-form-field>

    <div style="display: flex; gap: 1rem;">
      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Price (USD) *</mat-label>
        <input matInput type="number" formControlName="price" placeholder="0.00" min="0.01" step="0.01">
        <mat-error *ngIf="form.get('price')?.hasError('required')">Price is required</mat-error>
        <mat-error *ngIf="form.get('price')?.hasError('min')">Must be greater than 0</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Stock *</mat-label>
        <input matInput type="number" formControlName="stock" placeholder="0" min="0">
        <mat-error *ngIf="form.get('stock')?.hasError('min')">Cannot be negative</mat-error>
      </mat-form-field>
    </div>

    <div *ngIf="error" style="color: #ef4444; font-size: 0.875rem;">{{ error }}</div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid || saving">
    <mat-spinner *ngIf="saving" diameter="18" style="display:inline-block; margin-right: 6px;"></mat-spinner>
    {{ saving ? (isEdit ? 'Saving…' : 'Creating…') : (isEdit ? 'Save Changes' : 'Create Product') }}
  </button>
</mat-dialog-actions>
