<nav class="top-nav" aria-label="Primary navigation">
  <div class="nav-links">
    <a routerLink="/customer" class="nav-button">Home</a>
    <a routerLink="/customer/products" class="nav-button">
      <mat-icon>storefront</mat-icon>
      <span>Products</span>
    </a>
  </div>

  <div class="search-box" aria-label="Search placeholder">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      placeholder="Search products..."
      aria-label="Search products"
    />
  </div>

  <a routerLink="/customer/cart" class="cart-button" aria-label="Go to cart">
    <span class="cart-icon-wrapper">
      <mat-icon class="cart-icon">shopping_cart</mat-icon>
      <span class="cart-badge" *ngIf="cartItemCount > 0">
        {{ cartItemCount }}
      </span>
    </span>
    <span>Cart</span>
  </a>

  <a routerLink="/customer/dummy-login" class="nav-button">
    <mat-icon>person</mat-icon>
    <span>Login</span>
  </a>
</nav>
