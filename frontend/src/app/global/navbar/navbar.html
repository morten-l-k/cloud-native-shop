<nav class="top-nav" aria-label="Primary navigation">
  <div class="nav-links">
    <a routerLink="/customer" class="nav-button">Home</a>
    <a routerLink="/customer/products" class="nav-button">
      <mat-icon>storefront</mat-icon>
      <span>Products</span>
    </a>
  </div>

  <div class="search-box" aria-label="Search products">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      placeholder="Search products..."
      aria-label="Search products"
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
    />
  </div>

  <a routerLink="/customer/cart" class="cart-button" aria-label="Go to cart">
    <span class="cart-icon-wrapper">
      <mat-icon class="cart-icon">shopping_cart</mat-icon>
      <span class="cart-badge" *ngIf="cartItemCount > 0">
        {{ cartItemCount }}
      </span>
    </span>
    <span>Cart</span>
  </a>

  <a routerLink="/customer/dummy-login" class="nav-button" *ngIf="!(user$ | async)">
    <mat-icon>person</mat-icon>
    <span>Customer Login</span>
  </a>

  <a routerLink="/seller/login" class="nav-button" *ngIf="!(user$ | async)">
    <mat-icon>store</mat-icon>
    <span>Seller Login</span>
  </a>

  <button class="nav-button" (click)="logout()" *ngIf="user$ | async" style="background: none; border: none; cursor: pointer; font: inherit; color: inherit; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</nav>
