<nav class="top-nav" aria-label="Primary navigation">
  <div class="nav-links">
    <a routerLink="/customer" class="nav-button">Home</a>
    <a routerLink="/customer/products" class="nav-button">
      <mat-icon>storefront</mat-icon>
      <span>Products</span>
    </a>
  </div>

  <div class="search-box" aria-label="Search placeholder">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      placeholder="Search products..."
      aria-label="Search products"
    />
  </div>

  <a routerLink="/customer/cart" class="cart-button" aria-label="Go to cart">
    <span class="cart-icon-wrapper">
      <mat-icon class="cart-icon">shopping_cart</mat-icon>
      <span class="cart-badge" *ngIf="cartItemCount > 0">
        {{ cartItemCount }}
      </span>
    </span>
    <span>Cart</span>
  </a>

  <div class="login-dropdown-wrapper">
    <ng-container *ngIf="user$ | async as user; else notLoggedIn">
      <button class="nav-button dropdown-trigger">
        <mat-icon>account_circle</mat-icon>
        <span>{{ user.role | titlecase }}</span>
        <mat-icon class="chevron">expand_more</mat-icon>
      </button>
      <div class="dropdown-menu">
        <a *ngIf="user.role === 'customer'" routerLink="/customer/cart" class="dropdown-item">
          <mat-icon>receipt_long</mat-icon>
          <span>My Orders</span>
        </a>
        <a *ngIf="user.role === 'seller'" routerLink="/seller" class="dropdown-item">
          <mat-icon>dashboard</mat-icon>
          <span>Orders Dashboard</span>
        </a>
        <button class="dropdown-item" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Log out</span>
        </button>
      </div>
    </ng-container>
    <ng-template #notLoggedIn>
      <button class="nav-button dropdown-trigger">
        <mat-icon>person</mat-icon>
        <span>Login</span>
        <mat-icon class="chevron">expand_more</mat-icon>
      </button>
      <div class="dropdown-menu">
        <a routerLink="/customer/dummy-login" class="dropdown-item">
          <mat-icon>person</mat-icon>
          <span>Log in as Customer</span>
        </a>
        <a routerLink="/seller/login" class="dropdown-item">
          <mat-icon>store</mat-icon>
          <span>Log in as Seller</span>
        </a>
      </div>
    </ng-template>
  </div>
</nav>
