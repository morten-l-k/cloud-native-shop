<!-- A simple Header with inline styles for layout -->
<header style="background-color: #333; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
  <!-- Interpolation: Shows the value of 'shopName' from app.ts -->
  <h1 style="margin: 0;">{{ shopName }}</h1>

  <!-- A placeholder navigation bar -->
  <nav>
    <button>Home</button>
    <button>Products</button>
    <button>Cart</button>
  </nav>
</header>

<!-- The Main Content Area -->
<main style="padding: 2rem;">
  <h2>Welcome to the shop</h2>
  <p>This is a basic page. Try adding more buttons below!</p>

  <!-- Event Binding: Calls 'testButton()' in app.ts when clicked -->
  <button (click)="testButton()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
    Test Connection
  </button>
</main>
