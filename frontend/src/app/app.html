<mat-sidenav-container class="layout-container">
  <mat-sidenav #drawer mode="over" class="sidebar">
    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="app-header">
      <div class="header-left">
        <button mat-icon-button type="button" (click)="drawer.toggle()" aria-label="Open menu">
          <mat-icon>menu</mat-icon>
        </button>

        <a routerLink="/customer" class="logo-link" aria-label="Go to homepage">
          <h1 class="shop-title">
            Cloud Nat<span class="cloud-letter">i<mat-icon class="cloud-icon">cloud</mat-icon></span>ve Shop
          </h1>
        </a>
      </div>

      <div class="header-right">
        <app-navbar></app-navbar>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
