<header style="background-color: black; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
  <!-- We use a dotless 'i' and position a cloud icon above it -->
  <h1 style="margin: 0;">
    {{ shopNamePrefix }}<span style="position: relative; display: inline-block;">
      <app-cloud-icon style="width: 14px; height: 14px; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);"></app-cloud-icon>
      ı
    </span>{{ shopNameSuffix }}
  </h1>

  <!-- A placeholder navigation bar -->
<nav style="display: flex; gap: .5rem;">
  <button routerLink="/customer">Home</button>
  <button routerLink="/seller">Seller</button>
  <button routerLink="/admin">Admin</button>
</nav>
</header>

<!-- The Main Content Area -->
<main style="padding: 2rem;">
  <router-outlet></router-outlet>
</main>
