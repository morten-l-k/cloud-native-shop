services:

  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  db:
    image: postgres:15
    container_name: b2c_postgres
    restart: always
    environment:
      POSTGRES_USER: b2c_user
      POSTGRES_PASSWORD: b2c_password
      POSTGRES_DB: b2c_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/data:/data
    networks:
      - db_network


  # -----------------------------
  # Frontend (Angular)
  # -----------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: b2c_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - frontend_network


  # -----------------------------
  # Backend (C# .NET)
  # -----------------------------
  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: b2c_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
    command: dotnet watch run --no-launch-profile --urls=http://0.0.0.0:8080
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
    networks:
      - db_network
      - frontend_network


# -----------------------------
# Volumes
# -----------------------------
volumes:
  postgres_data:


# -----------------------------
# Networks
# -----------------------------
networks:
  db_network:
    driver: bridge
  frontend_network:
    driver: bridge